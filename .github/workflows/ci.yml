name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Type check ─────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Type Check
        working-directory: server
        run: npm run typecheck

      - name: Format Check
        working-directory: server
        run: npm run format:check

  # ─── Client (lint, build, test) ────────────────────
  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build (type check + bundle)
        working-directory: client
        run: npm run build

      - name: Run tests
        working-directory: client
        run: npm test

  # ─── Tests ──────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanbong
          POSTGRES_PASSWORD: sanbong_secret
          POSTGRES_DB: sanbong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://sanbong:sanbong_secret@localhost:5432/sanbong_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: postgresql://sanbong:sanbong_secret@localhost:5432/sanbong_test?schema=public
        run: npx prisma db seed

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://sanbong:sanbong_secret@localhost:5432/sanbong_test?schema=public
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          NODE_ENV: test
          CI: "true"
        run: npm test

  # ─── Stack production (Docker) ──────────────────────
  # Dựng đúng stack như khi deploy thật rồi kiểm tra từ bên ngoài.
  docker:
    name: Production stack (Docker)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for the stack
        run: |
          {
            echo "DOMAIN=http://localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "JWT_REFRESH_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "SEED_OWNER_EMAIL=owner@example.com"
            echo "SEED_OWNER_PASSWORD=CiSmokeTest2026Pass"
          } > .env

      - name: Validate compose file
        run: $COMPOSE config -q

      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 240

      - name: Prisma Client is generated inside the production image
        run: >
          $COMPOSE exec -T server node -e
          "const { PrismaClient } = require('@prisma/client'); new PrismaClient(); console.log('Prisma Client OK')"

      - name: Server does not run as root
        run: test "$($COMPOSE exec -T server id -u)" != "0"

      - name: Smoke test (UI, API, owner login, booking, QR)
        env:
          BASE_URL: http://localhost
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: CiSmokeTest2026Pass
          SMOKE_SET_BANK: "yes"
          SMOKE_CONFIRM: "yes"
        run: ./deploy/smoke-test.sh

      - name: Server refuses weak production configuration
        run: |
          out=$(docker run --rm --entrypoint node -e NODE_ENV=production sanbong-server \
            -e "require('./dist/lib/env.js')" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "JWT_SECRET là bắt buộc"

      - name: Backup and restore round trip
        run: |
          count() { $COMPOSE exec -T db psql -U sanbong -d sanbong -tAc "SELECT count(*) FROM bookings" | tr -d '[:space:]'; }
          before=$(count)
          test "$before" -ge 1
          ./deploy/backup.sh
          $COMPOSE exec -T db psql -U sanbong -d sanbong -c "DELETE FROM payments; DELETE FROM booking_zones; DELETE FROM bookings;"
          test "$(count)" = "0"
          ASSUME_YES=yes ./deploy/restore.sh "$(ls -t backups/sanbong-*.sql.gz | head -1)"
          $COMPOSE up -d --wait --wait-timeout 120
          test "$(count)" = "$before"

      - name: Show logs when something failed
        if: failure()
        run: $COMPOSE logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

